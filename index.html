<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي الإسلامي</title>
    <link rel="stylesheet" href="index.css?v=2">
</head>
<body>

<div class="container">
    <button type="button" class="settings-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel" aria-label="فتح الإعدادات">⚙</button>
    <section class="settings-panel" id="settingsPanel" hidden aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">الإعدادات</h2>
        <div class="setting-row">
            <span id="fontSizeLabel">حجم الخط</span>
            <div class="font-controls" aria-label="التحكم بحجم الخط">
                <button type="button" id="decreaseFont" aria-label="تصغير الخط">−</button>
                <button type="button" id="increaseFont" aria-label="تكبير الخط">+</button>
            </div>
        </div>
        <label class="setting-row" for="languageSelect">
            <span id="languageLabel">اللغة</span>
            <select id="languageSelect">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </label>
    </section>
    <h1>🕌 التطبيق الإسلامي</h1>
    <div class="system-clock" id="systemClock" aria-live="polite">الوقت الحالي</div>

    <div class="grid" id="homeScreen">
        <button class="card" data-section="duaa">🤲 أدعية</button>
        <button class="card" data-section="dailyDua">🌿 دعاء اليوم</button>
        <button class="card" data-section="quran">📖 القرآن الكريم</button>
        <button class="card" data-section="azkar">📿 أذكار</button>
        <button class="card" data-section="morningAzkar">🌅 أذكار الصباح</button>
        <button class="card" data-section="eveningAzkar">🌙 أذكار المساء</button>
        <button class="card" data-section="prayerAzkar">🕌 أذكار الصلاة</button>
        <button class="card" data-section="afterPrayerAzkar">📿 أذكار بعد الصلاة</button>
        <button class="card" data-section="sleepAzkar">🌙 أذكار النوم</button>
        <button class="card" data-section="wakingAzkar">🌅 أذكار الاستيقاظ</button>
        <button class="card" data-section="namesAllah">✨ أسماء الله الحسنى</button>
        <button class="card" data-section="hadith">📜 أحاديث نبوية</button>
    </div>

    <section class="content-page" id="contentPage" hidden aria-live="polite">
        <button type="button" class="home-arrow" id="homeArrow" aria-label="العودة إلى الصفحة الرئيسية" title="الصفحة الرئيسية">→</button>
        <h2 id="sectionTitle"></h2>
        <div class="item-number" id="itemNumber" aria-live="polite"></div>
        <div class="content-box" id="displayBox"></div>
        <nav class="content-navigation" aria-label="التنقل بين المحتوى">
            <button type="button" id="backButton">الرجوع</button>
            <button type="button" id="nextButton">التالي</button>
        </nav>
    </div>
</div>

<script src="index.js"></script>

</body>
</html>
