<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي الإسلامي</title>
    <style>
        :root { --page-bg: #f4f6f9; --surface: #fff; --content-bg: #f8f9fa; --text: #333; --heading: #2c3e50; --muted: #667; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--page-bg); color: var(--text); padding: 20px; text-align: center; }
        body.dark-theme { --page-bg: #151c18; --surface: #202a24; --content-bg: #18211c; --text: #e6eee8; --heading: #d9eddf; --muted: #b5c4ba; }
        .container { max-width: 600px; margin: 0 auto; background: var(--surface); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: var(--heading); margin-bottom: 20px; font-size: 24px; }
        .theme-toggle { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 18px; color: var(--text); cursor: pointer; }
        .theme-toggle input { width: 18px; height: 18px; accent-color: #2e7d32; cursor: pointer; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 25px; }
        .card { width: 100%; border: 0; background: #2e7d32; color: white; padding: 18px; border-radius: 12px; cursor: pointer; transition: transform 0.2s, background 0.2s; font-weight: bold; font-size: 18px; }
        .card:hover { transform: translateY(-3px); background: #1b5e20; }
        .content-box { background: var(--content-bg); border-right: 4px solid #2e7d32; padding: 15px; border-radius: 8px; text-align: right; min-height: 120px; line-height: 1.8; }
        .hadith-tag { font-size: 12px; color: #2e7d32; font-weight: bold; display: block; margin-bottom: 5px; }
        .source-tag { font-size: 13px; color: var(--muted); display: block; margin-top: 8px; }
        .prayer-controls { display: grid; gap: 12px; }
        .prayer-controls label { display: grid; gap: 5px; }
        .prayer-controls select { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: var(--surface); color: var(--text); }
        .prayer-actions { display: grid; gap: 8px; }
        .prayer-actions button { border: 0; border-radius: 8px; padding: 11px; color: #fff; background: #2e7d32; cursor: pointer; font-size: 15px; }
        .prayer-actions button.secondary { background: #0277bd; }
        .prayer-status { color: var(--muted); font-size: 13px; }
        .prayer-results { margin-top: 14px; }
        .prayer-results ul { list-style: none; padding: 0; }
        .prayer-results li { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(128, 128, 128, .25); padding: 5px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🕌 التطبيق الإسلامي</h1>

    <label class="theme-toggle">
        <input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)">
        <span>الوضع الداكن</span>
    </label>

    <div class="grid">
        <button class="card" onclick="showSection('duaa')">🤲 أدعية</button>
        <button class="card" onclick="showSection('dailyDua')">🌿 دعاء اليوم</button>
        <button class="card" onclick="showSection('quran')">📖 القرآن الكريم</button>
        <button class="card" onclick="showSection('azkar')">📿 أذكار</button>
        <button class="card" onclick="showSection('hadith')">📜 أحاديث نبوية</button>
        <button class="card" style="background: #0277bd;" onclick="showSection('prayer')">⏰ مواقيت الصلاة</button>
    </div>

    <div class="content-box" id="displayBox">
        اضغط على أي قسم لعرض المحتوى...
    </div>
</div>

<script>
    const data = {
        duaa: [
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.", source: "دعاء مأثور" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى.", source: "صحيح مسلم: 2721" },
            { text: "يَا مُقَلِّبَ الْقُلُوبِ، ثَبِّتْ قَلْبِي عَلَى دِينِكَ.", source: "جامع الترمذي: 2140" },
            { text: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.", source: "سنن أبي داود: 1522" },
            { text: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.", source: "سورة البقرة: 201" },
            { text: "رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ.", source: "سورة الأعراف: 23" },
            { text: "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي.", source: "صحيح مسلم: 2697" },
            { text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.", source: "صحيح البخاري: 6369" },
            { text: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي.", source: "صحيح البخاري وصحيح مسلم" },
            { text: "اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ، صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ.", source: "صحيح مسلم: 2654" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ.", source: "سنن أبي داود: 5074" },
            { text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا.", source: "صحيح مسلم: 2722" },
            { text: "رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي.", source: "سورة طه: 25-26" },
            { text: "رَبِّ زِدْنِي عِلْمًا.", source: "سورة طه: 114" },
            { text: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.", source: "سورة آل عمران: 8" },
            { text: "اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي.", source: "صحيح مسلم: 2725" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ.", source: "سنن أبي داود: 792" },
            { text: "يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.", source: "المستدرك للحاكم: 2000" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ، عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ.", source: "سنن ابن ماجه: 3846" },
            { text: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ.", source: "سورة الأعراف: 126" },
            { text: "رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ.", source: "سورة المؤمنون: 118" }
        ],
        dailyDua: [

            { text: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.", source: "سورة البقرة: 201" },
            { text: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.", source: "سنن أبي داود: 1522" },
            { text: "رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي.", source: "سورة طه: 25-26" },
            { text: "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي.", source: "صحيح مسلم: 2697" },
            { text: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.", source: "سورة آل عمران: 8" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ.", source: "سنن أبي داود: 5074" }
        ],
        quran: [
            { text: "إِنَّ مَعَ الْعُسْرِ يُسْرًا.", source: "سورة الشرح: 6" },
            { text: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ.", source: "سورة الرعد: 28" },
            { text: "وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا ۝ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ.", source: "سورة الطلاق: 2-3" },
            { text: "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا.", source: "سورة البقرة: 286" },
            { text: "قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَى أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا.", source: "سورة الزمر: 53" }

            { text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.", source: "100 مرة في اليوم، صحيح البخاري" },
            { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.", source: "100 مرة، صحيح البخاري وصحيح مسلم" },
            { text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", source: "100 مرة، صحيح البخاري وصحيح مسلم" },

            { text: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا.", source: "3 مرات صباحًا ومساءً، سنن أبي داود والترمذي" },
            { text: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.", source: "3 مرات صباحًا ومساءً، سنن أبي داود والترمذي" },
            { text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", source: "3 مرات مساءً، صحيح مسلم: 2708" },
            { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ.", source: "من أذكار الصباح والمساء، سنن أبي داود" },

            { text: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ.", source: "تملآن ما بين السماء والأرض، صحيح مسلم" },

        ],
        hadith: [
            { text: "«إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى».", source: "صحيح البخاري: 1، صحيح مسلم: 1907" },

            { text: "«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ».", source: "صحيح البخاري: 13، صحيح مسلم: 45" },
            { text: "«لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ».", source: "صحيح البخاري: 6114، صحيح مسلم: 2609" },
            { text: "«الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»." , source: "صحيح البخاري: 2989، صحيح مسلم: 1009" },
            { text: "«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَصِلْ رَحِمَهُ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«مَنْ لَا يَرْحَمْ لَا يُرْحَمْ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«الدِّينُ يُسْرٌ»." , source: "صحيح البخاري" },
            { text: "«الْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَانِ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«الْمَرْءُ مَعَ مَنْ أَحَبَّ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«إِنَّ اللَّهَ لَا يَقْبِضُ الْعِلْمَ انْتِزَاعًا يَنْتَزِعُهُ مِنَ الْعِبَادِ، وَلَكِنْ يَقْبِضُ الْعِلْمَ بِقَبْضِ الْعُلَمَاءِ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«لَا يَدْخُلُ الْجَنَّةَ قَاطِعٌ»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«لَا تَغْضَبْ»." , source: "صحيح البخاري" },
            { text: "«سَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا»." , source: "صحيح البخاري وصحيح مسلم" },
            { text: "«إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ»." , source: "صحيح مسلم" },
            { text: "«مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا، سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ»." , source: "صحيح مسلم" }
        ],
    };

    const currentIndexes = {};

    function showSection(section) {
        if (section === 'prayer') {
            showPrayerSection();
            return;
        }

        const content = data[section];
        const displayBox = document.getElementById('displayBox');

        if (Array.isArray(content)) {
            const index = ((currentIndexes[section] ?? -1) + 1) % content.length;
            currentIndexes[section] = index;
            const item = content[index];
            const label = section === 'hadith' ? 'حديث من الصحيحين' : section === 'quran' ? 'آية من القرآن الكريم' : section === 'azkar' ? 'ذكر' : section === 'dailyDua' ? 'دعاء اليوم' : 'دعاء';
            displayBox.innerHTML = `<span class="hadith-tag">${label}</span>${item.text}<span class="source-tag">${item.source}</span>`;
            return;
        }

        displayBox.innerHTML = content;
    }

    let currentPrayerCoordinates = null;

    function showPrayerSection() {
        const displayBox = document.getElementById('displayBox');
        displayBox.innerHTML = `
            <span class="hadith-tag">مواقيت الصلاة حسب موقعك</span>
            <div class="prayer-controls">
                <div class="prayer-actions">
                    <button type="button" id="retryPrayerLocation" class="secondary" onclick="getPrayerLocation()" hidden>إعادة طلب إذن الموقع</button>
                </div>
                <p class="prayer-status" id="prayerStatus" role="status">جارٍ طلب إذن الوصول إلى موقعك...</p>
            </div>
            <div class="prayer-results" id="prayerResults"></div>
            <span class="source-tag">سيُستخدم موقعك بعد موافقتك لحساب المواقيت على جهازك دون إرساله عبر الإنترنت. يعتمد الحساب على زاوية 18° للفجر والعشاء، وعلى الطريقة الشائعة للعصر، وقد تختلف النتائج قليلًا عن التقويم الرسمي.</span>`;
        currentPrayerCoordinates = null;
        getPrayerLocation();
    }

    function getPrayerLocation() {
        const status = document.getElementById('prayerStatus');
        const retryButton = document.getElementById('retryPrayerLocation');
        const results = document.getElementById('prayerResults');
        if (!status || !retryButton || !results) return;

        retryButton.hidden = true;
        results.textContent = '';
        if (!navigator.geolocation) {
            status.textContent = 'المتصفح لا يدعم تحديد الموقع.';
            retryButton.hidden = false;
            return;
        }
        if (!window.isSecureContext) {
            status.textContent = 'المتصفح يمنع تحديد الموقع عند فتح الملف بهذه الطريقة. افتحه عبر localhost أو HTTPS ثم اسمح بالوصول للموقع.';
            retryButton.hidden = false;
            return;
        }

        status.textContent = 'بانتظار إذن تحديد الموقع...';
        navigator.geolocation.getCurrentPosition(
            position => {
                if (document.getElementById('prayerStatus') !== status) return;
                currentPrayerCoordinates = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                };
                calculatePrayerTimesFromLocation();
            },
            error => {
                if (document.getElementById('prayerStatus') !== status) return;
                const messages = {
                    1: 'لم تسمح بالوصول إلى الموقع أو أن الإذن محظور. اسمح للموقع من إعدادات المتصفح ثم أعد المحاولة.',
                    2: 'تعذر تحديد موقعك. فعّل خدمة الموقع في الجهاز وتحقق من اتصال الجهاز بمصدر الموقع ثم أعد المحاولة.',
                    3: 'استغرق تحديد الموقع وقتًا طويلًا. تأكد من تفعيل خدمة الموقع ثم أعد المحاولة.'
                };
                status.textContent = messages[error.code] || 'تعذر تحديد الموقع. أعد المحاولة.';
                retryButton.hidden = false;
            },
            { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 }
        );
    }

    function calculatePrayerTimesFromLocation() {
        const status = document.getElementById('prayerStatus');
        const results = document.getElementById('prayerResults');
        if (!status || !results || !currentPrayerCoordinates) return;

        const { latitude, longitude } = currentPrayerCoordinates;
        const timezoneOffset = -new Date().getTimezoneOffset() / 60;
        const nowAtLocation = new Date(Date.now() + timezoneOffset * 60 * 60 * 1000);
        const year = nowAtLocation.getUTCFullYear();
        const month = nowAtLocation.getUTCMonth() + 1;
        const day = nowAtLocation.getUTCDate();
        const times = calculatePrayerTimes(latitude, longitude, timezoneOffset, year, month, day);
        const date = new Date(Date.UTC(year, month - 1, day, 12));
        const dateLabel = new Intl.DateTimeFormat('ar', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
        }).format(date);

        status.textContent = `تم تحديد موقعك: ${latitude.toFixed(4)}, ${longitude.toFixed(4)} | ${dateLabel} | توقيت جهازك UTC${timezoneOffset >= 0 ? '+' : ''}${timezoneOffset}`;
        results.innerHTML = `<ul>${Object.entries(times).map(([name, time]) => `<li><span>${name}</span><strong>${time}</strong></li>`).join('')}</ul>`;
    }

    function calculatePrayerTimes(latitude, longitude, timezoneOffset, year, month, day) {
        const julianDay = getJulianDay(year, month, day);
        const centuries = (julianDay - 2451545) / 36525;
        const meanLongitude = normalizeDegrees(280.46646 + centuries * (36000.76983 + centuries * 0.0003032));
        const meanAnomaly = normalizeDegrees(357.52911 + centuries * (35999.05029 - 0.0001537 * centuries));
        const eccentricity = 0.016708634 - centuries * (0.000042037 + 0.0000001267 * centuries);
        const obliquity = 23 + (26 + (21.448 - centuries * (46.815 + centuries * (0.00059 - centuries * 0.001813))) / 60) / 60;
        const correctedObliquity = obliquity + 0.00256 * Math.cos(toRadians(125.04 - 1934.136 * centuries));
        const solarCenter = Math.sin(toRadians(meanAnomaly)) * (1.914602 - centuries * (0.004817 + 0.000014 * centuries))
            + Math.sin(2 * toRadians(meanAnomaly)) * (0.019993 - 0.000101 * centuries)
            + 0.000289 * Math.sin(3 * toRadians(meanAnomaly));
        const apparentLongitude = meanLongitude + solarCenter - 0.00569
            - 0.00478 * Math.sin(toRadians(125.04 - 1934.136 * centuries));
        const y = Math.tan(toRadians(correctedObliquity / 2)) ** 2;
        const equationOfTime = 4 * (y * Math.sin(2 * toRadians(meanLongitude))
            - 2 * eccentricity * Math.sin(toRadians(meanAnomaly))
            + 4 * eccentricity * y * Math.sin(toRadians(meanAnomaly)) * Math.cos(2 * toRadians(meanLongitude))
            - 0.5 * y * y * Math.sin(4 * toRadians(meanLongitude))
            - 1.25 * eccentricity * eccentricity * Math.sin(2 * toRadians(meanAnomaly)));
        const declination = Math.asin(Math.sin(toRadians(correctedObliquity)) * Math.sin(toRadians(apparentLongitude)));
        const latitudeRadians = toRadians(latitude);
        const solarNoon = 720 - 4 * longitude - equationOfTime + timezoneOffset * 60;
        const sunriseAngle = getHourAngle(90.833, latitudeRadians, declination);
        const sunsetAngle = sunriseAngle;
        const fajrAngle = getHourAngle(108, latitudeRadians, declination);
        const ishaAngle = getHourAngle(107, latitudeRadians, declination);
        const asrAltitude = Math.atan(1 / (1 + Math.tan(Math.abs(latitudeRadians - declination))));
        const asrAngle = getHourAngle(90 - toDegrees(asrAltitude), latitudeRadians, declination);
        const sunrise = sunriseAngle === null ? null : solarNoon - 4 * sunriseAngle;
        const sunset = sunsetAngle === null ? null : solarNoon + 4 * sunsetAngle;
        const nightLength = sunrise === null || sunset === null ? null : (sunrise + 1440 - sunset) % 1440;
        const fajr = fajrAngle === null
            ? nightLength === null ? null : sunrise - nightLength * 0.15
            : solarNoon - 4 * fajrAngle;
        const isha = ishaAngle === null
            ? nightLength === null ? null : sunset + nightLength * (17 / 120)
            : solarNoon + 4 * ishaAngle;
        const format = minutes => minutes === null || !Number.isFinite(minutes) ? '--:--' : formatPrayerTime(minutes);

        return {
            'الفجر': format(fajr),
            'الشروق': format(sunrise),
            'الظهر': format(solarNoon),
            'العصر': format(asrAngle === null ? null : solarNoon + 4 * asrAngle),
            'المغرب': format(sunset),
            'العشاء': format(isha)
        };
    }

    function getJulianDay(year, month, day) {
        const adjustment = Math.floor((14 - month) / 12);
        const adjustedYear = year + 4800 - adjustment;
        const adjustedMonth = month + 12 * adjustment - 3;
        return day + Math.floor((153 * adjustedMonth + 2) / 5) + 365 * adjustedYear
            + Math.floor(adjustedYear / 4) - Math.floor(adjustedYear / 100)
            + Math.floor(adjustedYear / 400) - 32045;
    }

    function getHourAngle(zenith, latitude, declination) {
        const cosine = (Math.cos(toRadians(zenith)) - Math.sin(latitude) * Math.sin(declination))
            / (Math.cos(latitude) * Math.cos(declination));
        return cosine < -1 || cosine > 1 ? null : toDegrees(Math.acos(cosine));
    }

    function normalizeDegrees(degrees) {
        return ((degrees % 360) + 360) % 360;
    }

    function toRadians(degrees) {
        return degrees * Math.PI / 180;
    }

    function toDegrees(radians) {
        return radians * 180 / Math.PI;
    }

    function formatPrayerTime(minutes) {
        const roundedMinutes = Math.round(minutes);
        const normalizedMinutes = ((roundedMinutes % 1440) + 1440) % 1440;
        const hours = Math.floor(normalizedMinutes / 60);
        const remainder = normalizedMinutes % 60;
        return `${String(hours).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
    }

    function toggleTheme(isDark) {
        document.body.classList.toggle('dark-theme', isDark);
        try {
            localStorage.setItem('islamicAppTheme', isDark ? 'dark' : 'light');
        } catch (error) {
            // The theme still works for this page view when storage is unavailable.
        }
    }

    const themeToggle = document.getElementById('themeToggle');
    try {
        themeToggle.checked = localStorage.getItem('islamicAppTheme') === 'dark';
    } catch (error) {
        themeToggle.checked = false;
    }
    document.body.classList.toggle('dark-theme', themeToggle.checked);
</script>
